name: Release

# Publishes a GitHub release when a version tag is pushed, with files built here from the
# tagged commit rather than on someone's machine.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check the tag
        run: |
          version=$(jq -r .version package.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi
      - run: bun run typecheck
      - run: bun test
      - run: bun run package
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/*.png \
            --verify-tag \
            --title "$(jq -r .name src/manifest.json) ${GITHUB_REF_NAME#v}" \
            --notes-file release/notes.md
