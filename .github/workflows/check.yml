name: Check

# On commits that can change how the extension behaves: type check, unit tests, and the
# logged-out half of the live-site check. The signed-in half runs daily in check-daily.yml.
on:
  push:
    branches: [main]
    paths: &relevant
      - "src/**"
      - "tests/**"
      - "scripts/check-live.ts"
      - "build.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/check.yml"
  pull_request:
    paths: *relevant

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Install Chromium
        run: bun x playwright-core install --with-deps chromium
      - name: Check against the live site, logged out
        run: bun run scripts/check-live.ts
