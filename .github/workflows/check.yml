name: Check

# Runs on every push, and once a day to notice when Hacker News changes the markup this
# extension depends on. A failed scheduled run emails whoever last edited this file.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Install Chromium
        run: bun x playwright-core install --with-deps chromium
      # The account only views pages and upvotes then un-votes one story; the check blocks any
      # other write. Without the cookie the logged-in checks are skipped.
      - name: Check against the live site
        run: bun run scripts/check-live.ts
        env:
          HN_USERNAME: ${{ vars.HN_USERNAME }}
          HN_COOKIE: ${{ secrets.HN_COOKIE }}
